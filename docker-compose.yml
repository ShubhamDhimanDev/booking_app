version: '3'
services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        working_dir: /var/www/html
        volumes:
            - '.:/var/www/html'
        ports:
            - '8000:8000'
        environment:
            WWWUSER: 1000
            WWWGROUP: 1000
        command: sh -c "composer install --no-interaction && php artisan serve --host=0.0.0.0 --port=8000"
        depends_on:
            mysql:
                condition: service_healthy
        networks:
            - booking_app

    mysql:
        image: 'mysql/mysql-server:8.0'
        ports:
            - '3307:3306'
        environment:
            MYSQL_ROOT_PASSWORD: 'password'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: 'booking_app'
            MYSQL_USER: 'sail'
            MYSQL_PASSWORD: 'password'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
        volumes:
            - 'booking_app_mysql:/var/lib/mysql'
        networks:
            - booking_app
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-p${DB_PASSWORD}'
            retries: 10
            timeout: 5s

networks:
    booking_app:
        driver: bridge

volumes:
    booking_app_mysql:
        driver: local
